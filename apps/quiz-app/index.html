    <!-- 防止深色模式闪烁（FOUC - Flash of Unstyled Content） -->
    <script>
      (function () {
        const theme = localStorage.getItem("vueuse-color-scheme") || "auto";
        if (
          theme === "dark" ||
          (theme === "auto" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
